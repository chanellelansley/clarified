<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decision Clarity - AI Decision Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Decision Clarity</h1>
            <p class="subtitle">Get clarity on your decisions</p>
        </header>

        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="message assistant-message">
                    <div class="message-content">
                        <p>Hello! I'm here to help you think through decisions. What decision are you trying to make?</p>
                    </div>
                </div>
            </div>

            <div class="input-container">
                <textarea
                    id="userInput"
                    placeholder="Describe your decision..."
                    rows="3"
                ></textarea>
                <button id="sendButton">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                    Send
                </button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
