<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Clarified</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #1a1a1a;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2d5a27;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #2d5a27;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            background: #234a1f;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error {
            color: #dc2626;
            text-align: center;
            margin-top: 16px;
        }

        .success {
            color: #22c55e;
            text-align: center;
            margin-top: 16px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
        }

        .back-link:hover {
            color: #2d5a27;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div id="loading" class="loading">
            Verifying your reset link...
        </div>

        <div id="reset-form" style="display: none;">
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your new password below</p>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="new-password" placeholder="Enter new password (min 8 characters)">
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm new password">
            </div>

            <button class="btn" id="reset-btn" onclick="resetPassword()">Update Password</button>

            <p id="error-message" class="error" style="display: none;"></p>
            <p id="success-message" class="success" style="display: none;"></p>
        </div>

        <div id="invalid-link" style="display: none;">
            <h1>Invalid Link</h1>
            <p class="subtitle">This password reset link is invalid or has expired.</p>
            <a href="/" class="back-link">← Back to Clarified</a>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://qrmyceodqflqilsuxwjo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFybXljZW9kcWZscWlsc3V4d2pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzY3MTcyNTEsImV4cCI6MjA1MjI5MzI1MX0.11SbLRBOzgFGvd52LrGE5LKdDxKcKbhJjCdPfuDHQkY';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Check if we have a valid session from the recovery link
        async function checkRecoverySession() {
            try {
                // Supabase automatically handles the token from the URL
                const { data: { session }, error } = await supabase.auth.getSession();

                if (error) {
                    console.error('Session error:', error);
                    showInvalidLink();
                    return;
                }

                if (session) {
                    // Valid session - show the reset form
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('reset-form').style.display = 'block';
                } else {
                    // No session - invalid link
                    showInvalidLink();
                }
            } catch (error) {
                console.error('Error checking session:', error);
                showInvalidLink();
            }
        }

        function showInvalidLink() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('invalid-link').style.display = 'block';
        }

        async function resetPassword() {
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorEl = document.getElementById('error-message');
            const successEl = document.getElementById('success-message');
            const btn = document.getElementById('reset-btn');

            // Reset messages
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            // Validation
            if (!newPassword || !confirmPassword) {
                errorEl.textContent = 'Please fill in both fields';
                errorEl.style.display = 'block';
                return;
            }

            if (newPassword.length < 8) {
                errorEl.textContent = 'Password must be at least 8 characters';
                errorEl.style.display = 'block';
                return;
            }

            if (newPassword !== confirmPassword) {
                errorEl.textContent = 'Passwords do not match';
                errorEl.style.display = 'block';
                return;
            }

            // Update password
            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                const { error } = await supabase.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                successEl.textContent = 'Password updated successfully! Redirecting...';
                successEl.style.display = 'block';

                // Redirect to main app after 2 seconds
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);

            } catch (error) {
                console.error('Password update error:', error);
                errorEl.textContent = error.message || 'Failed to update password';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        }

        // Allow Enter key to submit
        document.getElementById('confirm-password')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') resetPassword();
        });

        // Initialize
        checkRecoverySession();
    </script>
</body>
</html>
